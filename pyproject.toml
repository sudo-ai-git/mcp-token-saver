[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-token-saver"
version = "1.0.0"
description = "Deterministic, no-LLM token-usage profiler + redundancy advisor for agent conversations. Shows where tokens go (per-role), detects exact + near-duplicate payloads, reports savings potential. Public methods only (SHA-256 exact dedupe + n-gram overlap) — auditable, no proprietary semantic layer."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "sudo-ai-git", email = "sudo-ai-git@users.noreply.github.com" }]
keywords = ["mcp", "tokens", "token-savings", "context", "dedupe", "llm-agents", "deterministic", "cost"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Build Tools",
]
dependencies = ["mcp>=1.0,<2"]

[project.scripts]
mcp-token-saver = "server:main_entry"
mcp-token-saver-pro = "pro_backend:main"

[tool.setuptools]
py-modules = ["mcp_token_saver", "server", "pro_client", "pro_backend"]
